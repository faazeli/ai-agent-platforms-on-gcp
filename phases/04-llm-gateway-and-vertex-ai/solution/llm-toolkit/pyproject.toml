[project]
name = "costpilot-llm"
version = "1.0.0"
description = "CostPilot LLM toolkit: structured output, versioned prompts, evals, AI spend in FOCUS"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11",
  "openai>=1.50",
]

[project.optional-dependencies]
vertex = ["google-genai>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costpilot_llm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
