# CostPilot application pipeline (Lab 9.4 and 9.6). Copy to .github/workflows/ in your repo.
#
#   PR:          lint + unit tests (Python and Java)
#   main:        build → scan → SBOM + provenance → sign → attest → bump dev overlay (GitOps)
#
# Keyless everywhere: GitHub's OIDC token is exchanged for short-lived Google
# credentials through Workload Identity Federation. No service-account key exists.
# Pin third-party actions by commit SHA in your own repo (Renovate/Dependabot keep them current).

name: app-ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "phases/09-devops-and-delivery/deploy/k8s/overlays/**"]

permissions:
  contents: read

env:
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/costpilot

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - phases/06-security-and-governance/solution/security
          - phases/06-security-and-governance/solution/cost-api
          - phases/06-security-and-governance/solution/mcp-finops
          - phases/04-llm-gateway-and-vertex-ai/solution/llm-toolkit
          - phases/05-multi-agent-adk-and-langgraph/solution/agents
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12"}
      - name: Install
        working-directory: ${{ matrix.package }}
        run: |
          uv venv
          uv pip install ruff pyyaml -e "../../../04-llm-gateway-and-vertex-ai/solution/llm-toolkit" \
            -e "../../../06-security-and-governance/solution/security[dev,fastapi,adk]" -e ".[dev]"
      - name: Lint
        working-directory: ${{ matrix.package }}
        run: uv run ruff check --select E,F,B --ignore E501 src tests
      - name: Test
        working-directory: ${{ matrix.package }}
        run: uv run pytest -q

  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12"}
      - name: Refresh contract fixtures from the Python API
        run: |
          uv venv && uv pip install -e phases/01-fastapi-pydantic-problem-details/solution/cost-api
          uv run python phases/07-java-integration/scripts/export_contract_fixtures.py
      - name: Test
        run: mvn -B -q -f phases/07-java-integration/solution/ledger-java/pom.xml test

  build-sign-push:
    if: github.event_name == 'push'
    needs: [python-tests, java-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # GitHub OIDC → Google (WIF) and → Sigstore (keyless signing)
    strategy:
      matrix:
        service: [cost-api, mcp-finops, agents]
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - id: build
        name: Build and push (with SBOM and SLSA provenance attached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: phases/09-devops-and-delivery/docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Scan (fail on critical vulnerabilities)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign (keyless, identity = this workflow)
        run: cosign sign --yes "${REGISTRY}/${{ matrix.service }}@${{ steps.build.outputs.digest }}"
      - name: Binary Authorization attestation
        if: vars.BINAUTHZ_ENABLED == 'true'
        run: |
          gcloud beta container binauthz attestations sign-and-create \
            --artifact-url="${REGISTRY}/${{ matrix.service }}@${{ steps.build.outputs.digest }}" \
            --attestor=built-by-ci --attestor-project="${{ vars.GCP_PROJECT }}" \
            --keyversion="${{ vars.BINAUTHZ_KEY_VERSION }}"
      # Matrix legs can't reliably share outputs, so each leg uploads its digest as an artifact.
      - run: mkdir -p digests && echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.service }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}

  promote-dev:
    # GitOps: CI never touches the cluster. It records the new digests in Git;
    # Argo CD notices and syncs the dev environment.
    needs: build-sign-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Pin new image digests in the dev overlay
        run: |
          cd phases/09-devops-and-delivery/deploy/k8s/overlays/dev
          for svc in cost-api mcp-finops agents; do
            kustomize edit set image "${svc}=${REGISTRY}/${svc}@$(cat "$GITHUB_WORKSPACE/digests/${svc}")"
          done
      - name: Commit
        run: |
          git config user.name "costpilot-ci"
          git config user.email "costpilot-ci@users.noreply.github.com"
          git commit -am "deploy(dev): ${GITHUB_SHA::7}" || echo "nothing to deploy"
          git push
