# Prompt and agent changes ship like code (Lab 9.4): a change to prompts, agent
# instructions, tool descriptions or the gateway config must not lower eval accuracy.
# Runs the Phase 4 prompt evals through a LiteLLM gateway started inside the job,
# using short-lived Google credentials from Workload Identity Federation.

name: eval-gate

on:
  pull_request:
    paths:
      - "phases/04-llm-gateway-and-vertex-ai/**/prompts/**"
      - "phases/04-llm-gateway-and-vertex-ai/gateway/config.yaml"
      - "phases/05-multi-agent-adk-and-langgraph/**/instructions/**"
      - "phases/03-mcp-tools-with-fastmcp/**/server.py"

permissions:
  contents: read
  id-token: write

jobs:
  prompt-evals:
    runs-on: ubuntu-latest
    env:
      VERTEX_PROJECT: ${{ vars.GCP_PROJECT }}
      VERTEX_LOCATION: global
      LITELLM_MASTER_KEY: sk-ci-only-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.EVAL_SERVICE_ACCOUNT }}   # roles/aiplatform.user only
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12"}
      - name: Start the gateway (no database, master key only, CI-scoped)
        run: |
          uv venv && uv pip install "litellm[proxy]" -e phases/04-llm-gateway-and-vertex-ai/solution/llm-toolkit
          sed '/database_url/d' phases/04-llm-gateway-and-vertex-ai/gateway/config.yaml > /tmp/gateway.yaml
          nohup uv run litellm --config /tmp/gateway.yaml --port 4000 > /tmp/litellm.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf localhost:4000/health/liveliness && break; sleep 2; done
      - name: Run evals (fails below the bar)
        working-directory: phases/04-llm-gateway-and-vertex-ai/solution/llm-toolkit
        env:
          OPENAI_API_KEY: ${{ env.LITELLM_MASTER_KEY }}
        run: uv run python -m costpilot_llm.evals.run_eval --model fast --runs 2 --min-accuracy 0.85
      - if: failure()
        run: tail -50 /tmp/litellm.log
