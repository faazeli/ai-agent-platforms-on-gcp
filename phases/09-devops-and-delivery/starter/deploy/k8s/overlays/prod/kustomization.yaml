apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs: {env: prod}
    includeSelectors: false

# Project-specific values in one place. The ConfigMap is "local-config", so kustomize
# uses it for replacements below and does not deploy it.
configMapGenerator:
  - name: project
    literals:
      - project_id=YOUR_PROD_PROJECT_ID
      - sa_domain=YOUR_PROD_PROJECT_ID.iam.gserviceaccount.com
    options:
      annotations: {config.kubernetes.io/local-config: "true"}

replacements:
  - source: {kind: ConfigMap, name: project, fieldPath: data.sa_domain}
    targets:
      - select: {kind: ServiceAccount}
        fieldPaths: ["metadata.annotations.[iam.gke.io/gcp-service-account]"]
        options: {delimiter: "@", index: 1}
      - select: {kind: Deployment, name: cost-api}
        fieldPaths: ["spec.template.spec.containers.[name=cost-api].env.[name=COST_API_TRUSTED_DELEGATORS].value"]
        options: {delimiter: "@", index: 1}
  - source: {kind: ConfigMap, name: project, fieldPath: data.project_id}
    targets:
      - select: {kind: Deployment, name: cost-api}
        fieldPaths: ["spec.template.spec.containers.[name=cost-api].env.[name=COST_API_GCP_PROJECT].value"]
      - select: {kind: Deployment, name: litellm}
        fieldPaths: ["spec.template.spec.containers.[name=litellm].env.[name=VERTEX_PROJECT].value"]

# CI sets these with:  kustomize edit set image cost-api=REGION-docker.pkg.dev/PROJECT/costpilot/cost-api@sha256:...
# Deploy by DIGEST, never by a moving tag.
images:
  - {name: cost-api, newName: us-central1-docker.pkg.dev/YOUR_PROD_PROJECT_ID/costpilot/cost-api, newTag: REPLACED_BY_CI}
  - {name: mcp-finops, newName: us-central1-docker.pkg.dev/YOUR_PROD_PROJECT_ID/costpilot/mcp-finops, newTag: REPLACED_BY_CI}
  - {name: agents, newName: us-central1-docker.pkg.dev/YOUR_PROD_PROJECT_ID/costpilot/agents, newTag: REPLACED_BY_CI}

# Prod: spread replicas across zones so one zone outage doesn't take a service down.
patches:
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector: {matchLabels: {service: costpilot}}
