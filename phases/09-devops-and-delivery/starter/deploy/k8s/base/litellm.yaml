apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  annotations:
    # Workload Identity: this KSA acts as this GSA (Phase 6). PROJECT_ID is replaced by the overlay.
    iam.gke.io/gcp-service-account: litellm-gsa@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels: {app: litellm}
spec:
  replicas: 2
  selector:
    matchLabels: {app: litellm}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: litellm}
    spec:
      serviceAccountName: litellm
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - {name: http, containerPort: 4000}
          env:
            - name: VERTEX_PROJECT
              value: 'PROJECT_ID'
            - name: VERTEX_LOCATION
              value: 'global'
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: litellm, key: master-key}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: litellm, key: database-url}
          resources:
            # Requests drive both scheduling and (on Autopilot) the bill: size them from Phase 8.
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health/liveliness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            # Exception: LiteLLM generates its database client at startup and needs a
            # writable filesystem. Run it as a fixed non-root user; LiteLLM also publishes
            # a non-root image variant you can switch to (check its docs for the tag).
            readOnlyRootFilesystem: false
            runAsUser: 1000
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /app/config.yaml, subPath: config.yaml, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap: {name: litellm-config}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels: {app: litellm}
spec:
  selector: {app: litellm}
  ports:
    - {name: http, port: 4000, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: litellm
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: litellm}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: litellm}
