[project]
name = "cost-api"
version = "3.0.0"
description = "CostPilot cost-api: FOCUS cost data over HTTP with RFC 9457 errors"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "uvicorn[standard]>=0.30",
  # Phase 6 security library. Install it first:
  #   pip install -e ../security
  "costpilot-security",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "cryptography>=42"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_api"]

[tool.pytest.ini_options]
pythonpath = ["src", "../security/src"]
testpaths = ["tests"]
asyncio_mode = "auto"
