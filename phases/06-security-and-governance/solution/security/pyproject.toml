[project]
name = "costpilot-security"
version = "1.0.0"
description = "CostPilot security: identity, delegation, RBAC, tamper-evident audit, Model Armor guardrails"
requires-python = ">=3.11"
dependencies = [
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "google-auth>=2.30",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]
adk = ["google-adk>=2.10,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "cryptography>=42"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costpilot_security"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::UserWarning"]
