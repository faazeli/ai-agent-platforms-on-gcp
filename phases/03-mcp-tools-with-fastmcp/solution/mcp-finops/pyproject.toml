[project]
name = "mcp-finops"
version = "1.0.0"
description = "CostPilot FinOps tools over the Model Context Protocol (FastMCP)"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.4,<4",
  "httpx>=0.27",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
mcp-finops = "mcp_finops.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_finops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
