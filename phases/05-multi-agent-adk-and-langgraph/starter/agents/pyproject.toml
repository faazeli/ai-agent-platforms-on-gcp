[project]
name = "costpilot-agents"
version = "1.0.0"
description = "CostPilot agents: an ADK team and a LangGraph report workflow, with enforced execution boundaries"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.10,<3",
  "litellm>=1.70",
  "langgraph>=1.2,<2",
  "langchain-openai>=1.0",
  "langchain-mcp-adapters>=0.3",
  "pydantic>=2.11",
  # Phase 4's toolkit (structured output + scorer). Install it first:
  #   pip install -e ../../04-llm-gateway-and-vertex-ai/solution/llm-toolkit
  "costpilot-llm",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=2"]
agent-engine = ["google-cloud-aiplatform[agent_engines,adk]"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costpilot_agents"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "../../../04-llm-gateway-and-vertex-ai/solution/llm-toolkit/src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::UserWarning"]
